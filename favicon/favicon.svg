<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tianyuan Liu">
<title>Tianyuan Liu</title>
<!-- 天, the first character of the given name - the 刘天元 that sits under the
     Latin name in the rail of every page. Four strokes, symmetric, and the one
     thing on the site that is his and nobody else's: a T on a square is a
     letter tile anyone could own.

     Drawn, not set. Plex has no 天, and any CJK face set at 16px turns the two
     horizontals into grey. So it is built on a 4-unit grid: every horizontal
     edge lands on a whole device pixel at 16, 32 and 48 (1:2:3), and only the
     two legs are antialiased, which is what a diagonal is.

     Strokes 8 units - 2px at 16. Top bar 32 wide, second bar 48: the short
     first stroke is what keeps 天 from reading as 二 over 人. Legs 12 wide,
     splayed 18 over 24, so their perpendicular weight is 9.6 - a fifth heavier
     than the bars, as 撇 and 捺 are in any Heiti. Their feet stop level with the
     ends of the second bar, and each leg runs 4 units up into that bar so no
     renderer can open a hairline at the join.

     Ink box 48 of 64 - 2px of tile each side at 16px. A CJK glyph fills its
     em box the way a capital never does, and it needs the room to read.

     Bone #EFEDE4 on pine #16302A, 12.0:1. One file for light and dark chrome:
     on a dark strip the tile goes and the glyph floats; on a light one the
     tile gives it an edge. Still no copper. -->
<rect width="64" height="64" fill="#16302A"/>
<g fill="#EFEDE4">
<rect x="16" y="8" width="32" height="8"/>
<rect x="8" y="24" width="48" height="8"/>
<polygon points="26,28 38,28 38,32 20,56 8,56 26,32"/>
<polygon points="26,28 38,28 38,32 56,56 44,56 26,32"/>
</g>
</svg>
